services:
  backend:
    build: ./backend
    container_name: deepseek-ocr-backend
    env_file:
      - .env
    environment:
      MODEL_NAME: ${MODEL_NAME:-deepseek-ai/DeepSeek-OCR}
      HF_HOME: ${HF_HOME:-/models}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "4g"
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    networks:
      - ocr-network

  proxy:
    build: ./proxy
    container_name: deepseek-ocr-proxy
    env_file:
      - .env
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:-default_token}
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_API_KEY: ${PAPERLESS_API_KEY}
      BACKEND_OCR_URL: http://backend:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOCAL_SAVE_DIR: /app/processed_pdfs
      LOCAL_SAVE_ENABLED: ${LOCAL_SAVE_ENABLED:-true}
    volumes:
      - ./processed_pdfs:/app/processed_pdfs
    ports:
      - "${PROXY_PORT:-8001}:8001"
    depends_on:
      - backend
    networks:
      - ocr-network

  frontend:
    build: ./frontend
    container_name: deepseek-ocr-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - ocr-network

networks:
  ocr-network:
    driver: bridge
